name: Deploy Locaweb

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_deploy:
        description: "Forcar deploy completo (vendor + build)"
        required: false
        type: boolean
        default: false
      run_migrate:
        description: "Executar migrations no banco de producao"
        required: false
        type: boolean
        default: true
      migrate_only:
        description: "Rodar apenas migrations (sem upload de arquivos)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed areas
        if: github.event.inputs.migrate_only != 'true'
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            composer:
              - 'composer.json'
              - 'composer.lock'
            frontend:
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.js'
              - 'tailwind.config.js'
              - 'postcss.config.js'
              - 'resources/js/**'
              - 'resources/css/**'
              - 'resources/views/**'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Cache vendor directory
        if: github.event.inputs.migrate_only != 'true'
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies (production)
        if: github.event.inputs.migrate_only != 'true'
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        if: github.event.inputs.migrate_only != 'true' && (steps.changes.outputs.frontend == 'true' || github.event.inputs.full_deploy == 'true')
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        if: github.event.inputs.migrate_only != 'true' && (steps.changes.outputs.frontend == 'true' || github.event.inputs.full_deploy == 'true')
        run: npm ci

      - name: Build frontend assets
        if: github.event.inputs.migrate_only != 'true' && (steps.changes.outputs.frontend == 'true' || github.event.inputs.full_deploy == 'true')
        run: npm run build

      - name: Prepare deploy package
        if: github.event.inputs.migrate_only != 'true'
        run: |
          mkdir -p .deploy/secretaria .deploy/app
          rsync -av --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".vscode" \
            --exclude "docs" \
            --exclude "node_modules" \
            --exclude "tests" \
            --exclude ".env" \
            --exclude ".env.*" \
            --exclude "vendor" \
            --exclude "public/build" \
            --exclude "public/hot" \
            --exclude "storage/app/*" \
            --exclude "storage/logs/*" \
            --exclude "storage/framework/cache/*" \
            --exclude "storage/framework/sessions/*" \
            --exclude "storage/framework/views/*" \
            --exclude "storage/debugbar/*" \
            --exclude "storage/tmp/*" \
            --exclude ".phpunit.result.cache" \
            --exclude "phpunit.xml" \
            ./ .deploy/secretaria/

          rsync -av --delete --exclude "build" ./public/ .deploy/app/

          if [ "${{ steps.changes.outputs.composer }}" = "true" ] || [ "${{ github.event.inputs.full_deploy }}" = "true" ]; then
            rsync -av ./vendor/ .deploy/secretaria/vendor/
          fi

          if [ "${{ steps.changes.outputs.frontend }}" = "true" ] || [ "${{ github.event.inputs.full_deploy }}" = "true" ]; then
            rsync -av ./public/build/ .deploy/secretaria/public/build/
            rsync -av ./public/build/ .deploy/app/build/
          fi

      - name: Inspect deploy package
        if: github.event.inputs.migrate_only != 'true'
        run: |
          echo "== Secretaria package size =="
          du -sh .deploy/secretaria
          echo "== Secretaria file count =="
          find .deploy/secretaria -type f | wc -l
          echo "== Public app package size =="
          du -sh .deploy/app
          echo "== Public app file count =="
          find .deploy/app -type f | wc -l

      - name: Install lftp
        if: github.event.inputs.migrate_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload project to ~/secretaria
        if: github.event.inputs.migrate_only != 'true'
        timeout-minutes: 240
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          set xfer:clobber on
          set mirror:parallel-transfer-count 1
          mirror --reverse --delete --exclude .env --exclude storage/app --exclude public/build --exclude vendor --verbose=3 .deploy/secretaria secretaria
          bye
          EOF

      - name: Upload vendor to ~/secretaria/vendor
        if: github.event.inputs.migrate_only != 'true' && (steps.changes.outputs.composer == 'true' || github.event.inputs.full_deploy == 'true')
        timeout-minutes: 240
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          set xfer:clobber on
          set mirror:parallel-transfer-count 1
          mirror --reverse --verbose=3 .deploy/secretaria/vendor secretaria/vendor
          bye
          EOF

      - name: Upload public entrypoint to ~/public_html/app
        if: github.event.inputs.migrate_only != 'true'
        timeout-minutes: 60
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-allow no
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          set xfer:clobber on
          set mirror:parallel-transfer-count 1
          mirror --reverse --delete --exclude build --verbose=3 .deploy/app public_html/app
          bye
          EOF

      - name: Run production migrations (remote DB)
        if: github.event_name == 'push' || github.event.inputs.run_migrate == 'true' || github.event.inputs.migrate_only == 'true'
        env:
          APP_ENV: production
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: php artisan migrate --force --no-interaction
